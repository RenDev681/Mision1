<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTC-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="Mision1.css" rel="stylesheet" type="text/css">
        <script defer src="Mision1.js"></script>
    </head>
    <body>
        <section id="mainMenu">
            <div id="rightBox">
                <h1 id="title">Ratón de biblioteca</h1>
            
                <div id="selectorBox">
                    <div>
                        <input type="number" id="selector" placeholder="5" min="5" max="10">
                    </div>
                    <div>
                        <button id="botonSelector" class="boton" onclick="crearGrid()">Jugar</button>
                    </div>
                    <div>
                        <button id="botonExit" class="boton" onclick="exit()">Salir</button>
                    </div>
                </div>
            </div>

            <img id="questionImage" src="Media/Images/menuSignR.png">
            
        </section>

        <section id="game">
            <div id="scoreBoard">
                <p id="counter">0</p>
            </div>
                <div id="cuadricula">
            </div>
        </section>

        <section id="endScene">

        </section>

        <section id="deathScreen">
            <h1 id="deathTitle">Has muerto</h1>
            <div id="deathBox">
                <div>
                    <p class="finalCounter">0</p>
                </div>
                <div>
                    <button class="resetBoton" class="boton" onclick="reset()">Volver a jugar</button>
                </div>
            </div>
        </section>

        <section id="victoryScreen">
            <h1 id="victoryTitle">Has ganado</h1>
            <div id="victoryBox">
                <div>
                    <p>Has conseguido: </p>
                    <p class="finalCounter">0</p>
                </div>
                <div>
                    <button class="resetBoton" class="boton" onclick="reset()">Volver a jugar</button>
                </div>
            </div>
        </section>
    </body>
</html>
